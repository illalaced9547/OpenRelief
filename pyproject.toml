[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-relief"
version = "0.1.0"
description = "Reproducible food-security time-series research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
annotation = ["openai>=1.0", "pydantic>=2.0", "python-dotenv>=1.0"]
test = ["pytest>=8"]
evaluation = ["numpy>=2", "scikit-learn>=1.6", "matplotlib>=3.9"]

[project.scripts]
open-relief = "open_relief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "open-relief-data/src"]
testpaths = ["tests", "open-relief-data/tests"]
